name: Build and Push to Docker Hub

# This triggers the workflow every time you push to the main branch
on:
  push:
    branches:
      - main

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    
    steps:
      # 1. Check out the repository code
      - name: Checkout Code
        uses: actions/checkout@v4

      # 2. Log in to Docker Hub using the secrets we just created
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # 3. Build and push the Backend image
      - name: Build and Push Backend Image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: true
          # This creates a tag like: yourusername/tech-test-backend:latest
          tags: ${{ secrets.DOCKER_USERNAME }}/tech-test-backend:latest

      # 4. Build and push the Frontend image
      - name: Build and Push Frontend Image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: true
          # This creates a tag like: yourusername/tech-test-frontend:latest
          tags: ${{ secrets.DOCKER_USERNAME }}/tech-test-frontend:latest