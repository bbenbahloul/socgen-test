name: Apply Terraform Infrastructure

# 'workflow_dispatch' adds a "Run workflow" button in the GitHub UI
on:
  workflow_dispatch:
    inputs:
      action:
        description: 'Choose action: plan or apply'
        required: true
        default: 'plan'
        type: choice
        options:
          - plan
          - apply

jobs:
  terraform:
    name: 'Terraform'
    runs-on: ubuntu-latest
    
    # We run this inside the 'infra' folder
    defaults:
      run:
        working-directory: ./infra

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # 1. Configure AWS Credentials (reusing your existing secrets!)
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      # 2. Install Terraform
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      # 3. Initialize Terraform
      - name: Terraform Init
        run: terraform init

      # 4. Run Terraform Plan (Always runs)
      - name: Terraform Plan
        run: terraform plan -out=tfplan

      # 5. Run Terraform Apply (Only if you selected 'apply' in the UI)
      - name: Terraform Apply
        if: ${{ github.event.inputs.action == 'apply' }}
        run: terraform apply -auto-approve tfplan